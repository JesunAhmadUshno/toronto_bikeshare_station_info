source:
  - changed-files:
      - any-glob-to-any-file: ["js/**", "css/**", "index.html"]
site:
  - changed-files:
      - any-glob-to-any-file: ["site/**"]
automation:
  - changed-files:
      - any-glob-to-any-file: [".github/**"]
docs:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "README.md"]
